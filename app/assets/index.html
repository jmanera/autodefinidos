<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Autodefinidos</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="claro">
<div id="app">
  <header id="top">
    <button class="btn icon" id="bMenu" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand">
      <h1>Autodefinidos</h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTime">0:00</b><span>Tiempo</span></div>
      <div class="stat"><b id="sProg">0%</b><span>Hecho</span></div>
    </div>
    <nav class="tools">
      <button class="btn" id="bCheck" aria-label="Comprobar"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg><span>Comprobar</span></button>
      <button class="btn" id="bHelp" aria-label="Ayudas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span>Ayudas</span></button>
      <button class="btn" id="bPause" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span>Pausa</span></button>
      <button class="btn" id="bNew" aria-label="Nuevo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nuevo</span></button>
    </nav>
  </header>
  <div id="main">
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="pauseCover"><div><h2>En pausa</h2><button class="btn primary" id="bResume">Continuar</button></div></div>
      <div id="busy"><div><div class="spin"></div><p>Preparando el autodefinido…</p></div></div>
    </div>
    <aside id="side">
      <div id="clueBox">
        <div class="clue-main">
          <button class="btn icon ghost" id="bPrev" aria-label="Definición anterior"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <div class="clue-txt">
            <div class="clue-dir" id="cDir"></div>
            <div class="clue-text" id="cText"></div>
          </div>
          <button class="btn icon ghost" id="bNext" aria-label="Definición siguiente"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
        <div class="clue-cross" id="cCross"></div>
      </div>
      <div id="kbd"></div>
    </aside>
  </div>
</div>
<div id="modal"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script src="dict/d2.js"></script>
<script src="dict/d3.js"></script>
<script src="dict/d4.js"></script>
<script src="dict/d5.js"></script>
<script src="dict/d6.js"></script>
<script src="dict/d7.js"></script>
<script src="gen.js"></script>
<script src="app.js"></script>
</body>
</html>
